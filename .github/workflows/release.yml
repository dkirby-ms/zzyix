name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      ) }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check Out
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: main

      - name: Set Up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check If client Changed
        id: client_changed
        run: |
          set -euo pipefail
          chmod +x ./scripts/should-release-app.sh
          ./scripts/should-release-app.sh client >> "$GITHUB_OUTPUT"

      - name: Release client
        if: steps.client_changed.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:client

      - name: Skip client Release
        if: steps.client_changed.outputs.release != 'true'
        run: echo "No client-specific changes detected since the last client release tag."

      - name: Check If server Changed
        id: server_changed
        run: |
          set -euo pipefail
          chmod +x ./scripts/should-release-app.sh
          ./scripts/should-release-app.sh server >> "$GITHUB_OUTPUT"

      - name: Release server
        if: steps.server_changed.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:server

      - name: Skip server Release
        if: steps.server_changed.outputs.release != 'true'
        run: echo "No server-specific changes detected since the last server release tag."