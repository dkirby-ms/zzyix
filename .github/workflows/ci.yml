name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'e2e/**'
      - 'playwright*.config.ts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'commitlint.config.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'e2e/**'
      - 'playwright*.config.ts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'commitlint.config.cjs'

jobs:
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages on pull request
        if: github.event_name == 'pull_request'
        run: |
          npm exec -- commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose || true

      - name: Validate commit message on push
        if: github.event_name == 'push'
        run: |
          npm exec -- commitlint \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}" \
            --verbose || true

  # ── Point 1: Audit ───────────────────────────────────────────────────────────
  audit:
    name: Audit
    runs-on: ubuntu-latest
    needs: commitlint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit

  # ── Point 2: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: audit
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [client, server]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint ${{ matrix.app }}
        run: npm run lint:${{ matrix.app }}

  release-contract:
    name: Release Contract
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run release contract checks
        run: npm run test:release-contract

  # ── Point 3: Test ────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        app: [client, server]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test ${{ matrix.app }}
        run: npm run test:${{ matrix.app }}
      - name: Upload coverage (${{ matrix.app }})
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage/
          retention-days: 7

  # ── Point 4: Build ───────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [client, server]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build ${{ matrix.app }}
        run: npm run build:${{ matrix.app }}

  authenticated-e2e:
    name: Authenticated owner-only E2E
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zzyix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run authenticated owner-only E2E
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zzyix
        run: npm run test:e2e:owner-only

  authenticated-multi-replica-e2e:
    name: Authenticated multi-replica E2E
    runs-on: ubuntu-latest
    needs: authenticated-e2e
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zzyix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run authenticated multi-replica E2E
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zzyix
        run: npm run test:e2e:multi-replica
