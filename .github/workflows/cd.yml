                --name "${SERVER_CONTAINER_APP_NAME}" \
                --environment "${CONTAINERAPPS_ENVIRONMENT}" \
                --image "${SERVER_IMAGE}" \
                --target-port "${SERVER_TARGET_PORT}" \
                --ingress internal \
                --env-vars "NODE_ENV=production" "CORS_ORIGIN=${SERVER_CORS_ORIGIN_BOOTSTRAP}" "DATABASE_URL=${SERVER_DATABASE_URL}" "LEGACY_RETIREMENT_REPORT_BASE64=secretref:legacy-retirement-report" "LEGACY_RETIREMENT_REPORT_PATH=${LEGACY_RETIREMENT_REPORT_PATH}" "LEGACY_RETIREMENT_REPORT_SHA256=${LEGACY_RETIREMENT_REPORT_SHA256}" "LEGACY_RETIREMENT_PARITY_PASSED=${LEGACY_RETIREMENT_PARITY_PASSED}" "LEGACY_RETIREMENT_RECOVERY_PASSED=${LEGACY_RETIREMENT_RECOVERY_PASSED}" "LEGACY_RETIREMENT_MULTI_REPLICA_PASSED=${LEGACY_RETIREMENT_MULTI_REPLICA_PASSED}" "LEGACY_RETIREMENT_AUTHENTICATED_PRINCIPAL_INTEGRATION_PASSED=${LEGACY_RETIREMENT_AUTHENTICATED_PRINCIPAL_INTEGRATION_PASSED}" "LEGACY_RETIREMENT_ROLLBACK_POLICY_APPROVED=${LEGACY_RETIREMENT_ROLLBACK_POLICY_APPROVED}" "AUTH_TRUSTED_ISSUER=${AUTH_TRUSTED_ISSUER}" "AUTH_API_AUDIENCE=${AUTH_API_AUDIENCE}" "AUTH_REQUIRED_SCOPE=${AUTH_REQUIRED_SCOPE}" "AUTH_JWKS_URI=${AUTH_JWKS_URI}" "AUTH_ACCEPTED_ALGORITHM=${AUTH_ACCEPTED_ALGORITHM}" "AUTH_TELEMETRY_GATE_APPROVED=${AUTH_TELEMETRY_GATE_APPROVED}" "AUTH_ROLLBACK_GATE_APPROVED=${AUTH_ROLLBACK_GATE_APPROVED}" "AUTH_RETENTION_POLICY_APPROVED=${AUTH_RETENTION_POLICY_APPROVED}" "AUTH_DELETION_COMPLETION_POLICY_APPROVED=${AUTH_DELETION_COMPLETION_POLICY_APPROVED}" "AUTH_OWNER_E2E_GATE_APPROVED=${AUTH_OWNER_E2E_GATE_APPROVED}" "AUTH_MIGRATION_REHEARSAL_APPROVED=${AUTH_MIGRATION_REHEARSAL_APPROVED}" "AUTH_MUTATION_ROLLBACK_APPROVED=${AUTH_MUTATION_ROLLBACK_APPROVED}" "AUTH_PRODUCTION_AUTHORIZATION_BENCHMARK_APPROVED=${AUTH_PRODUCTION_AUTHORIZATION_BENCHMARK_APPROVED}" "FEATURE_PROTOCOL_V2_MUTATION_ENABLED=${FEATURE_PROTOCOL_V2_MUTATION_ENABLED}" "FEATURE_QUILT_PROTOCOL_V2_ENABLED=${FEATURE_QUILT_PROTOCOL_V2_ENABLED}" \
