[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zzyix-agent-worker"
version = "0.1.0"
description = "Read-only Fantome resident-agent worker MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agent-framework>=0.1.0",
  "psycopg[binary]>=3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "checkpoints",
  "control_plane",
  "gateway",
  "main",
  "supervisor",
  "telemetry",
  "tools",
  "workflow",
]
