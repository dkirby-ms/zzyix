server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /auth-config.json {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /auth-config.json =404;
  }

  # Keep browser API traffic same-origin without capturing unrelated SPA routes.
  location ~ ^/(health|me|sessions|ownership|quilts|claims|ownership-transfers|account)(/|$) {
    proxy_pass https://${BACKEND_SERVICE_HOSTNAME};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host ${BACKEND_SERVICE_HOSTNAME};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io {
    proxy_pass https://${BACKEND_SERVICE_HOSTNAME};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host ${BACKEND_SERVICE_HOSTNAME};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve static files
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
